# The source of truth for this service in the registry. CI publishes it to
# github.com/mcafeelabs/services under services/inventory/.
$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [http, nats, events]
properties:
  log:
    type: object
    properties:
      level: {enum: [debug, info, warn, error]}
  http:
    type: object
    properties:
      port: {type: integer}
  nats:
    type: object
    required: [url]
    properties:
      url: {type: string, pattern: "^nats://"}
  events:
    type: object
    required: [stockChanged]
    properties:
      stockChanged: {type: string}
